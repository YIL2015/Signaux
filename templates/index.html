<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Suivi de consommation</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h1>Suivi de consommation</h1>

  <!-- Les chiffres clés -->
  <p>Moyenne : <strong id="moyenne">-</strong></p>
  <p>Pic : <strong id="max">-</strong> (<span id="max_t">-</span>)</p>

  <!-- Le graphique -->
  <canvas id="graphique"></canvas>

  <script>
    // true = données bidon (pour travailler seul), false = vraies données de Flask
    const MODE_TEST = true;

    const DONNEES_TEST = {
      points: [
        { t: "2026-10-02T08:00:00", conso: 0.12 },
        { t: "2026-10-02T08:05:00", conso: 0.10 },
        { t: "2026-10-02T08:10:00", conso: 0.12 },
        { t: "2026-10-02T08:15:00", conso: 0.10 }
      ],
      stats: { moyenne: 0.175, max: 0.30, max_t: "2026-10-02T08:05:00", total: 0.70 }
    };

    async function chargerDonnees() {
      if (MODE_TEST) return DONNEES_TEST;
      const reponse = await fetch("/api/data");   // appelle la route de ta collègue
      return await reponse.json();
    }

    async function afficher() {
      const { points, stats } = await chargerDonnees();

      // 1. Remplir les chiffres
      document.getElementById("moyenne").textContent = stats.moyenne;
      document.getElementById("max").textContent = stats.max;
      document.getElementById("max_t").textContent = stats.max_t;

      // 2. Dessiner le graphique
      new Chart(document.getElementById("graphique"), {
        type: "line",
        data: {
          labels: points.map(p => p.t),
          datasets: [
            { label: "Consommation", data: points.map(p => p.conso), borderColor: "blue" },
            { label: "Moyenne", data: points.map(() => stats.moyenne),
              borderColor: "orange", borderDash: [6, 6], pointRadius: 0 }
          ]
        }
      });
    }

    afficher();
  </script>
</body>
</html>
